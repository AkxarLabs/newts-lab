<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room preview</title>
<!-- Dev gallery for code-drawn rooms: /static/rooms/preview.html?room=lab&theme=night&scale=1&crop=x,y,w,h
     Renders the bake + live layer at 1:1 (or a crop of it, magnified) with fake live state. -->
<style>
  html, body { margin: 0; background: #111; color: #ddd; font: 12px system-ui, sans-serif; }
  canvas { display: block; }
  #bar { position: fixed; top: 6px; left: 8px; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="bar"></div>
<canvas id="c"></canvas>
<script src="kit.js"></script>
<script src="lab.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const room = q.get('room') || 'lab', theme = q.get('theme') || 'night', scale = parseFloat(q.get('scale') || '1');
  const crop = (q.get('crop') || '0,0,1600,900').split(',').map(Number);
  const R = window.CodeRooms[room];
  const st = { slotsCap: 3, slotsUse: +(q.get('use') || 1), busy: +(q.get('busy') || 1), nActive: 2, nAnalysis: 1, seed: 2.3 };
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const t0 = performance.now();
  const bake = R.bake(theme, scale);
  document.getElementById('bar').textContent = `${room} · ${theme} · bake ${scale}× in ${Math.round(performance.now() - t0)} ms`;
  const W = window.innerWidth, H = Math.round(W * crop[3] / crop[2]);
  c.width = W * devicePixelRatio; c.height = H * devicePixelRatio; c.style.width = W + 'px'; c.style.height = H + 'px';
  function frame(now) {
    const k = W / crop[2];
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.save(); ctx.scale(k, k); ctx.translate(-crop[0], -crop[1]);
    ctx.drawImage(bake, 0, 0, 1600, 900);
    R.live(ctx, theme, now / 1000, st);
    ctx.restore();
    if (!q.has('still')) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
