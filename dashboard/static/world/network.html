<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room network — prototype</title>
<!-- A PROTOTYPE for choosing the world's next shape: the lab as a networked cluster of rooms instead of a
     house. Rooms are the workflow's (workflow/stages.yaml), dressed in their real art (rooms/*.js), laid
     out as a graph whose links are the moves a study makes; the gates sit on the links they guard.
     ?style=pods|islands|station  ?theme=night|day  ?extra (two rooms a lab added in Compose)
     Fake studies move along the links; click a room to step inside, click outside or Esc to step back. -->
<style>
  @font-face { font-family: 'Newsreader'; src: url('../vendor/fonts/newsreader-opsz-normal.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Newsreader'; src: url('../vendor/fonts/newsreader-opsz-italic.woff2') format('woff2'); font-weight: 200 800; font-style: italic; }
  @font-face { font-family: 'Instrument Sans'; src: url('../vendor/fonts/instrument-sans-wght-normal.woff2') format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('../vendor/fonts/ibm-plex-mono-400.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('../vendor/fonts/ibm-plex-mono-500.woff2') format('woff2'); font-weight: 500 800; }
  :root { --bg: #0b1114; --ink: #e9efed; --soft: #a2b1ad; --faint: #6c7c78; --card: rgba(17, 24, 27, .86); --edge: rgba(255, 255, 255, .1); --accent: #5ccfbc; }
  body.day { --bg: #f3f0e9; --ink: #1b1915; --soft: #5d584f; --faint: #948e83; --card: rgba(255, 254, 251, .9); --edge: rgba(30, 26, 20, .12); --accent: #1d776a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.5 'Instrument Sans', system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #bar { position: fixed; z-index: 2; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #bar h1 { margin: 0 8px 0 0; font: 450 26px/1 'Newsreader', Georgia, serif; letter-spacing: -.01em; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--card); border: 1px solid var(--edge); backdrop-filter: blur(10px); }
  .seg button { border: 0; background: none; color: var(--soft); font: 500 13px 'Instrument Sans', sans-serif; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--bg); }
  .kick { font: 500 10.5px 'IBM Plex Mono', monospace; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  #cap { position: fixed; z-index: 2; left: 16px; bottom: 16px; max-width: 520px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--edge); backdrop-filter: blur(10px); }
  #cap p { margin: 6px 0 0; font: 400 16px/1.45 'Newsreader', Georgia, serif; color: var(--soft); }
  #busy { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: italic 400 22px 'Newsreader', serif; color: var(--soft); z-index: 3; }
</style>
</head>
<body>
<div id="bar"><h1>Room network</h1>
  <div class="seg" id="styles"></div><div class="seg" id="themes"></div><div class="seg" id="extra"></div>
  <span class="kick">click a room to step inside · esc to step back</span></div>
<div id="cap"></div>
<div id="busy">Cutting the rooms out of paper…</div>
<canvas id="c"></canvas>
<script src="noise.js"></script>
<script src="tokens.js"></script>
<script src="paper.js"></script>
<script src="components.js"></script>
<script src="building.js"></script>
<!-- newts:rooms — the server puts one <script> per room file here -->
<script src="../ui/workflow-default.js"></script>
<script>
(async () => {
  'use strict';
  const W = VivWorld, T = W.tokens, q = new URLSearchParams(location.search);
  const S = { style: q.get('style') || 'pods', theme: q.get('theme') || 'night', extra: q.has('extra') };
  const STYLES = {
    pods: ['Pods', 'A clean graph: each room a card you can see into, studies as dots travelling the links. Closest to the new dashboard.'],
    islands: ['Islands', 'Each room a paper diorama on its own floating island; rope bridges are the moves between them. Keeps the most of the paper charm.'],
    station: ['Station', 'Round modules joined by tubes, light flowing through them — a lab in orbit. Playful, still structured.'],
  };
  const UI = {
    night: { bg: '#0b1114', bg2: '#13202a', card: '#121a1e', edge: 'rgba(255,255,255,0.10)', ink: '#e9efed', soft: '#a2b1ad', faint: '#6c7c78', accent: '#5ccfbc', warm: '#f0c26c', link: 'rgba(160,215,205,0.32)' },
    day: { bg: '#f3f0e9', bg2: '#e9e2d3', card: '#fffefb', edge: 'rgba(30,26,20,0.14)', ink: '#1b1915', soft: '#5d584f', faint: '#948e83', accent: '#1d776a', warm: '#a3600f', link: 'rgba(60,50,35,0.28)' },
  };
  const ROLE = { 'experiment-runner': '#5ccfbc', overseer: '#8db7ff', 'fresh-context-reviewer': '#b3a0ff', 'ideation-critic': '#f08fc8', 'scoping-advocate': '#f0c26c', orchestrator: '#e0c47e' };
  await Promise.race([Promise.all(['600 20px Newsreader', '500 13px "Instrument Sans"', '500 11px "IBM Plex Mono"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 1500))]);

  // ── the workflow (optionally with two rooms a lab added in Compose) ───────────────────────────
  function workflow() {
    const wf = JSON.parse(JSON.stringify(window.__WORKFLOW_DEFAULT__));
    if (S.extra) {
      const at = wf.states.findIndex(s => s.id === 'analysis');
      wf.states.splice(at + 1, 0, { id: 'replicating', label: 'Replicating', stage: 'replication', room: 'bench' });
      const lab = wf.rooms.find(r => r.id === 'lab'); lab.states = lab.states.filter(s => s !== 'analysis');
      wf.rooms.push({ id: 'data', label: 'Data', title: 'The Data Room', states: ['analysis'] });
      wf.rooms.push({ id: 'bench', label: 'Bench', title: 'Replication Bench', states: ['replicating'] });
      wf.states.find(s => s.id === 'analysis').room = 'data';
      wf.back_edges = (wf.back_edges || []).concat([['replicating', 'active']]);
    }
    return wf;
  }

  /** rooms = nodes; the moves a study makes between rooms = links; gates sit on the link they guard */
  function graph(wf) {
    const roomOf = {};
    wf.rooms.forEach(r => (r.states || []).forEach(s => { roomOf[s] = r.id; }));
    const order = wf.states.map(s => s.id), side = new Set((wf.side_states || []).map(s => s.id));
    const nodes = wf.rooms.map(r => {
      const idx = (r.states || []).filter(s => !side.has(s)).map(s => order.indexOf(s)).filter(i => i >= 0);
      return { id: r.id, title: r.title || r.label, label: r.label, states: r.states || [], rank: idx.length ? Math.min(...idx) : 99, side: !idx.length };
    });
    const ranks = [...new Set(nodes.filter(n => !n.side).map(n => n.rank))].sort((a, b) => a - b);
    nodes.forEach(n => { n.col = n.side ? ranks.length / 2 - 0.5 : ranks.indexOf(n.rank); });
    const links = new Map();
    const link = (a, b, kind) => { if (!a || !b || a === b) return null; const k = a + '>' + b; if (!links.has(k)) links.set(k, { a, b, kind, gate: null }); return links.get(k); };
    for (let i = 0; i < order.length - 1; i++) link(roomOf[order[i]], roomOf[order[i + 1]], 'forward');
    (wf.back_edges || []).forEach(([x, y]) => link(roomOf[x], roomOf[y], 'back'));
    const shelf = nodes.find(n => n.side);
    if (shelf) { link(shelf.id, roomOf[wf.revive_to || order[1]], 'revive'); }
    const inside = {};
    (wf.gates || []).forEach(g => { const l = g.before && links.get(roomOf[g.at] + '>' + roomOf[g.before]); if (l) l.gate = g.n; else inside[roomOf[g.at]] = g.n; });
    nodes.forEach(n => { n.gate = inside[n.id] || null; });
    return { nodes, links: [...links.values()], roomOf, order };
  }

  /** a gentle force layout: left to right by when a study arrives, pushed apart, pulled along its links */
  function layout(G) {
    const N = G.nodes, by = Object.fromEntries(N.map(n => [n.id, n]));
    N.forEach((n, i) => { n.x = n.col * 400; n.y = n.side ? 470 : (n.col % 2 ? -150 : 150) + (i % 3 - 1) * 20; n.vx = n.vy = 0; });
    for (let it = 0; it < 700; it++) {
      for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
        const a = N[i], b = N[j]; let dx = b.x - a.x, dy = b.y - a.y; const d = Math.max(1, Math.hypot(dx, dy)); dx /= d; dy /= d;
        const f = 4.2e5 / (d * d) + (d < 430 ? (430 - d) * 0.6 : 0);
        a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
      }
      for (const l of G.links) { if (l.kind === 'back') continue; const a = by[l.a], b = by[l.b]; const dx = b.x - a.x, dy = b.y - a.y, d = Math.max(1, Math.hypot(dx, dy)), f = (d - 390) * 0.04; a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f; }
      for (const n of N) { n.vx += (n.col * 390 - n.x) * 0.03; n.vy += ((n.side ? 470 : 0) - n.y) * 0.006; n.vx *= 0.6; n.vy *= 0.6; n.x += Math.max(-30, Math.min(30, n.vx)); n.y += Math.max(-30, Math.min(30, n.vy)); }
    }
    G.by = by;
  }

  // ── baking each room's real art flat (the shell + its props, as the engine stacks them) ─────────
  function bakeComp(TH, name, props, seed, res) {
    const def = W.components[name], [w, h] = def.size(props), P = W.paper.painter(TH, w, h, res, seed);
    def.draw(P, props);
    for (const part of (def.parts ? def.parts(props) || [] : [])) {
      const PP = W.paper.painter(TH, part.size[0], part.size[1], res, seed + 1); part.draw(PP, props);
      P.raw(x => { x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(PP.base, (P.pad + part.at[0] - PP.pad) * res, (P.pad + part.at[1] - PP.pad) * res); });
    }
    return { P, w, h };
  }
  function bakeRoom(TH, spec, res) {
    const [rw, rh] = spec.size, out = document.createElement('canvas'); out.width = Math.round(rw * res); out.height = Math.round(rh * res);
    const x = out.getContext('2d'), glows = [], seed = W.noise.strSeed(spec.key);
    const sh = bakeComp(TH, 'shell', Object.assign({ w: rw, h: rh }, spec.shell, { banner: null }), seed, res);
    x.drawImage(sh.P.base, -sh.P.pad * res, -sh.P.pad * res); if (sh.P.glow) glows.push([sh.P.glow, -sh.P.pad * res, -sh.P.pad * res]);
    const list = spec.props.map((pr, i) => ({ pr, i })).sort((a, b) => ((W.components[a.pr.c] || {}).flat ? -1e4 : 0) + a.pr.at[1] - (((W.components[b.pr.c] || {}).flat ? -1e4 : 0) + b.pr.at[1]));
    for (const { pr, i } of list) {
      if (!W.components[pr.c]) continue;
      const s = W.depthScale(pr.at[1]) * (pr.scale || 1.3), b = bakeComp(TH, pr.c, pr.props || {}, seed + i * 13, res * s);
      const px = (pr.at[0] * rw - s * b.w / 2 - s * b.P.pad) * res, py = (pr.at[1] * rh - s * b.h - s * b.P.pad) * res;
      x.drawImage(b.P.base, px, py); if (b.P.glow) glows.push([b.P.glow, px, py]);
    }
    x.globalCompositeOperation = 'lighter'; x.globalAlpha = TH.glow.strength * 0.7;
    for (const [g, gx, gy] of glows) x.drawImage(g, gx, gy);
    return out;
  }

  // ── the scene ─────────────────────────────────────────────────────────────────────────────────
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  let G, art = {}, islands = {}, TH, U, cam = { x: 0, y: 0, s: 1 }, camT = { x: 0, y: 0, s: 1 }, focus = null, hover = null, t = 0;
  const POD = { w: 300, h: 171 }, ORB = 118, TOP = 76, BOTTOM = 120;   // screen room kept for the bar and the caption
  const midY = () => TOP + (innerHeight - TOP - BOTTOM) / 2;
  const dims = () => S.style === 'station' ? { w: ORB * 2, h: ORB * 2 } : POD;
  let studies = [], movers = [];

  async function build() {
    document.getElementById('busy').style.display = 'flex';
    await new Promise(r => setTimeout(r, 30));
    document.body.classList.toggle('day', S.theme === 'day');
    TH = T.themes[S.theme]; U = UI[S.theme];
    const wf = workflow(); W.applyWorkflow(wf); G = graph(wf); layout(G);
    art = {}; islands = {};
    for (const n of G.nodes) art[n.id] = bakeRoom(TH, W.rooms[n.id], 0.42);
    for (const n of G.nodes) islands[n.id] = bakeIsland(n);
    seedStudies(wf);
    fit(true);
    document.getElementById('busy').style.display = 'none';
    renderBar();
  }
  function bakeIsland(n) {
    const w = POD.w * 1.5, h = 150, P = W.paper.painter(TH, w, h, 1, W.noise.strSeed(n.id) + 5);
    const Sx = W.paper.S;
    P.piece(Sx.poly([[w * 0.1, 40], [w * 0.9, 40], [w * 0.62, h - 6], [w * 0.5, h], [w * 0.38, h - 10]]), { fill: S.theme === 'day' ? 'wood.mid' : 'surface.section', lift: 3, hatch: 0.5, deckle: 1.4 });
    P.piece(Sx.blob(w / 2, 40, w * 0.47, 30, W.noise.strSeed(n.id), 0.18), { fill: 'plant.leafLight', lift: 4, wash: 'wash.green', deckle: 1.2 });
    P.piece(Sx.blob(w / 2, 36, w * 0.4, 20, W.noise.strSeed(n.id) + 3, 0.15), { fill: S.theme === 'day' ? 'paper.light' : 'paper.card', lift: 1.5, deckle: 0.8 });
    return { img: P.base, pad: P.pad, w, h, glow: P.glow };
  }
  function seedStudies(wf) {
    const names = ['Sparse MoE routing', 'Curriculum distillation', 'Long-context eval', 'Token routing', 'Scaling probes', 'Quantisation note', 'RL fine-tuning', 'Adaptive optimisers', 'Pruning at scale', 'Retrieval heads', 'Data mixing laws', 'Sparse attention'];
    const live = G.order.filter(s => s !== 'final');
    studies = names.map((title, i) => ({ id: 's' + i, title, state: live[(i * 3) % live.length], hue: (i * 47) % 360, slot: i }));
    movers = [];
  }
  function fit(snap) {
    const d = dims(), xs = G.nodes.map(n => n.x), ys = G.nodes.map(n => n.y);
    const x0 = Math.min(...xs) - d.w / 2 - 80, x1 = Math.max(...xs) + d.w / 2 + 80, y0 = Math.min(...ys) - d.h / 2 - 90, y1 = Math.max(...ys) + d.h / 2 + (S.style === 'islands' ? 150 : 90);
    const sw = innerWidth, sh = innerHeight - TOP - BOTTOM;
    camT = { x: (x0 + x1) / 2, y: (y0 + y1) / 2, s: Math.min(sw / (x1 - x0), sh / (y1 - y0), 1.25) };
    if (focus) { const n = G.by[focus], isl = S.style === 'islands'; camT = { x: n.x, y: n.y + (isl ? 60 : S.style === 'station' ? 20 : 30), s: Math.min(sw * 0.82 / (isl ? d.w * 1.5 : d.w), sh * 0.8 / (d.h + (isl ? 190 : 80))) }; }
    if (snap) cam = { ...camT };
  }

  // links are quadratic curves bowing to the right of their direction, so a back-move never covers a forward one
  function curve(l) {
    const a = G.by[l.a], b = G.by[l.b], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const bow = l.kind === 'back' ? 0.32 : l.kind === 'revive' ? 0.18 : 0.1;
    return { a, b, c: { x: mx - dy / d * d * bow, y: my + dx / d * d * bow } };
  }
  const qp = (k, u) => ({ x: (1 - u) * (1 - u) * k.a.x + 2 * (1 - u) * u * k.c.x + u * u * k.b.x, y: (1 - u) * (1 - u) * k.a.y + 2 * (1 - u) * u * k.c.y + u * u * k.b.y });

  // ── a little life: every few seconds a study takes its next step ───────────────────────────────
  setInterval(() => {
    if (!G) return;
    const s = studies[Math.floor(Math.random() * studies.length)];
    const i = G.order.indexOf(s.state);
    let next = Math.random() < 0.08 ? 'parked' : G.order[i + 1];
    if (s.state === 'parked') next = 'triaged';
    if (!next || movers.some(m => m.s === s)) return;
    if (next === 'final') { s.state = G.order[0]; return; }   // a finished one makes room for a new seed
    const ra = G.roomOf[s.state], rb = G.roomOf[next];
    s.state = next;
    if (ra !== rb) { const l = G.links.find(x => x.a === ra && x.b === rb); if (l) movers.push({ s, l, u: 0, wait: l.gate ? 1.4 : 0 }); }
  }, 1600);

  // ── drawing ───────────────────────────────────────────────────────────────────────────────────
  function frame(now) {
    const dt = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now; t += dt;
    const dpr = Math.min(2, devicePixelRatio || 1);
    if (cv.width !== innerWidth * dpr || cv.height !== innerHeight * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; fit(false); }
    const k = 1 - Math.pow(0.0015, dt); cam.x += (camT.x - cam.x) * k; cam.y += (camT.y - cam.y) * k; cam.s += (camT.s - cam.s) * k;
    background(dpr);
    cx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * (innerWidth / 2 - cam.x * cam.s), dpr * (midY() - cam.y * cam.s));
    for (const l of G.links) drawLink(l);
    for (const m of movers) {
      if (m.wait > 0 && m.u >= 0.5) { m.wait -= dt; } else m.u = Math.min(1, m.u + dt * 0.55);
    }
    movers = movers.filter(m => m.u < 1);
    for (const n of G.nodes) drawNode(n);
    for (const m of movers) drawToken(m);
    requestAnimationFrame(frame);
  }
  function background(dpr) {
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = innerWidth, h = innerHeight;
    const g = cx.createRadialGradient(w * 0.5, h * 0.55, 0, w * 0.5, h * 0.55, Math.max(w, h) * 0.75);
    g.addColorStop(0, U.bg2); g.addColorStop(1, U.bg); cx.fillStyle = g; cx.fillRect(0, 0, w, h);
    if (S.style === 'pods') {            // a quiet dot grid
      cx.fillStyle = S.theme === 'day' ? 'rgba(30,26,20,0.08)' : 'rgba(255,255,255,0.05)';
      const step = 28 * cam.s, ox = (w / 2 - cam.x * cam.s) % step, oy = (midY() - cam.y * cam.s) % step;
      for (let x = ox; x < w; x += step) for (let y = oy; y < h; y += step) cx.fillRect(x, y, 1.2, 1.2);
    } else if (S.style === 'station') {  // stars (night) or a pale sky with drifting specks (day)
      for (let i = 0; i < 160; i++) { const x = (W.noise.hash2(i, 1, 3) * w + t * 2 * (i % 3)) % w, y = W.noise.hash2(i, 2, 3) * h; cx.fillStyle = S.theme === 'day' ? 'rgba(60,50,35,0.15)' : `rgba(220,240,255,${0.2 + 0.5 * W.noise.hash2(i, 3, 3)})`; cx.fillRect(x, y, 1.5, 1.5); }
    } else {                              // islands: soft clouds
      for (let i = 0; i < 9; i++) { const x = ((W.noise.hash2(i, 4, 5) * w * 1.4 + t * 6 * (1 + i % 3)) % (w * 1.4)) - w * 0.2, y = W.noise.hash2(i, 5, 5) * h; const r = 60 + 80 * W.noise.hash2(i, 6, 5);
        const cg = cx.createRadialGradient(x, y, 0, x, y, r * 1.6); cg.addColorStop(0, S.theme === 'day' ? 'rgba(255,255,255,0.55)' : 'rgba(120,200,190,0.06)'); cg.addColorStop(1, 'rgba(255,255,255,0)'); cx.fillStyle = cg; cx.beginPath(); cx.ellipse(x, y, r * 1.6, r * 0.7, 0, 0, 6.283); cx.fill(); }
    }
  }
  function drawLink(l) {
    const k = curve(l), hot = hover && (hover === l.a || hover === l.b);
    cx.save(); cx.lineCap = 'round';
    const path = () => { cx.beginPath(); cx.moveTo(k.a.x, k.a.y); cx.quadraticCurveTo(k.c.x, k.c.y, k.b.x, k.b.y); };
    if (S.style === 'station') {
      path(); cx.strokeStyle = S.theme === 'day' ? '#9aa3a3' : '#2c3b3d'; cx.lineWidth = l.kind === 'forward' ? 22 : 14; cx.stroke();
      path(); cx.strokeStyle = S.theme === 'day' ? '#dfe7e4' : '#173139'; cx.lineWidth = l.kind === 'forward' ? 14 : 8; cx.stroke();
      path(); cx.setLineDash([10, 26]); cx.lineDashOffset = -t * 60; cx.strokeStyle = hot ? U.accent : (S.theme === 'day' ? 'rgba(29,119,106,0.55)' : 'rgba(95,240,216,0.55)'); cx.lineWidth = 4; cx.stroke();
    } else if (S.style === 'islands') {
      const off = 7, n = 22;
      for (const side of [-1, 1]) { cx.beginPath(); for (let i = 0; i <= n; i++) { const u = i / n, p = qp(k, u), q2 = qp(k, Math.min(1, u + 0.01)), dx = q2.x - p.x, dy = q2.y - p.y, d = Math.hypot(dx, dy) || 1, sag = Math.sin(u * Math.PI) * 10; const x = p.x - dy / d * off * side, y = p.y + dx / d * off * side + sag; i ? cx.lineTo(x, y) : cx.moveTo(x, y); } cx.strokeStyle = S.theme === 'day' ? '#6f5a44' : 'rgba(127,233,215,0.45)'; cx.lineWidth = 1.6; cx.setLineDash(l.kind === 'forward' ? [] : [5, 5]); cx.stroke(); }
      cx.setLineDash([]);
      if (l.kind === 'forward') for (let i = 1; i < n; i++) { const u = i / n, p = qp(k, u), q2 = qp(k, u + 0.01), dx = q2.x - p.x, dy = q2.y - p.y, d = Math.hypot(dx, dy) || 1, sag = Math.sin(u * Math.PI) * 10; cx.beginPath(); cx.moveTo(p.x - dy / d * 9, p.y + dx / d * 9 + sag); cx.lineTo(p.x + dy / d * 9, p.y - dx / d * 9 + sag); cx.strokeStyle = S.theme === 'day' ? '#a07c55' : 'rgba(180,150,110,0.6)'; cx.lineWidth = 4; cx.stroke(); }
    } else {
      path(); cx.strokeStyle = hot ? U.accent : U.link; cx.lineWidth = l.kind === 'forward' ? 2 : 1.4; cx.setLineDash(l.kind === 'forward' ? [] : [4, 6]); cx.stroke(); cx.setLineDash([]);
      const p = qp(k, 0.62), p2 = qp(k, 0.66), ang = Math.atan2(p2.y - p.y, p2.x - p.x);   // a small arrowhead
      cx.translate(p.x, p.y); cx.rotate(ang); cx.beginPath(); cx.moveTo(6, 0); cx.lineTo(-5, -5); cx.lineTo(-5, 5); cx.closePath(); cx.fillStyle = hot ? U.accent : U.link; cx.fill();
    }
    cx.restore();
    if (l.gate) gateBadge(qp(k, 0.5), l.gate, movers.some(m => m.l === l && m.wait > 0 && m.u >= 0.5));
  }
  function gateBadge(p, n, waiting) {
    cx.save();
    const r = 15 + (waiting ? Math.sin(t * 8) * 1.5 : 0);
    if (waiting) { cx.beginPath(); cx.arc(p.x, p.y, r + 9, 0, 6.283); cx.fillStyle = S.theme === 'day' ? 'rgba(163,96,15,0.18)' : 'rgba(240,194,108,0.2)'; cx.fill(); }
    cx.beginPath(); cx.arc(p.x, p.y, r, 0, 6.283); cx.fillStyle = U.card; cx.fill(); cx.lineWidth = 1.5; cx.strokeStyle = U.warm; cx.stroke();
    cx.fillStyle = U.warm; cx.font = '600 12px "IBM Plex Mono", monospace'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('G' + n, p.x, p.y + 0.5);
    cx.restore();
  }
  function roundRect(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
  function drawNode(n) {
    const img = art[n.id], here = studies.filter(s => G.roomOf[s.state] === n.id && !movers.some(m => m.s === s)), on = hover === n.id || focus === n.id;
    cx.save();
    if (S.style === 'station') {
      const R = ORB;
      cx.beginPath(); cx.arc(n.x, n.y, R + 14, 0, 6.283); cx.fillStyle = S.theme === 'day' ? '#c9d0cf' : '#22323a'; cx.shadowColor = 'rgba(0,0,0,0.35)'; cx.shadowBlur = 30; cx.fill(); cx.shadowBlur = 0;
      cx.lineWidth = 3; cx.strokeStyle = on ? U.accent : (S.theme === 'day' ? '#9aa3a3' : '#3b5560'); cx.stroke();
      cx.save(); cx.beginPath(); cx.arc(n.x, n.y, R, 0, 6.283); cx.clip();
      const sc = (R * 2) / img.height * 1.05; cx.drawImage(img, n.x - img.width * sc / 2, n.y - img.height * sc / 2, img.width * sc, img.height * sc);
      cx.restore();
      cx.beginPath(); cx.arc(n.x, n.y, R, 0, 6.283); cx.lineWidth = 2; cx.strokeStyle = S.theme === 'day' ? 'rgba(255,255,255,0.8)' : 'rgba(95,240,216,0.35)'; cx.stroke();
      for (let i = 0; i < 18; i++) { const a = i / 18 * 6.283 + t * 0.15, lit = (i + Math.floor(t * 2)) % 6 === 0; cx.beginPath(); cx.arc(n.x + Math.cos(a) * (R + 8), n.y + Math.sin(a) * (R + 8), 2.2, 0, 6.283); cx.fillStyle = lit ? U.accent : (S.theme === 'day' ? 'rgba(60,70,70,0.35)' : 'rgba(150,200,200,0.25)'); cx.fill(); }
      here.forEach((s, i) => { const a = Math.PI * 0.75 + (i + 0.5) / Math.max(here.length, 1) * Math.PI * 0.5 * Math.min(1, here.length / 3); dot(n.x + Math.cos(a) * (R + 26), n.y + Math.sin(a) * (R + 26), s); });
      label(n, n.x, n.y + R + 50);
    } else if (S.style === 'islands') {
      const isl = islands[n.id], iw = POD.w * 1.5, ih = isl.h;
      cx.drawImage(isl.img, n.x - iw / 2 - isl.pad, n.y + POD.h / 2 - 48 - isl.pad);
      if (isl.glow && S.theme === 'night') { cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = 0.4; cx.drawImage(isl.glow, n.x - iw / 2 - isl.pad, n.y + POD.h / 2 - 48 - isl.pad); cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1; }
      const bob = Math.sin(t * 0.8 + n.x * 0.01) * 3;
      cx.translate(0, bob);
      cx.shadowColor = S.theme === 'day' ? 'rgba(86,64,31,0.35)' : 'rgba(0,0,0,0.6)'; cx.shadowBlur = 18; cx.shadowOffsetY = 6;
      cx.drawImage(img, n.x - POD.w / 2, n.y - POD.h / 2, POD.w, POD.h); cx.shadowBlur = 0; cx.shadowOffsetY = 0;
      if (on) { cx.lineWidth = 2; cx.strokeStyle = U.accent; cx.strokeRect(n.x - POD.w / 2, n.y - POD.h / 2, POD.w, POD.h); }
      here.forEach((s, i) => dot(n.x - POD.w * 0.38 + (i % 8) * 16, n.y + POD.h / 2 + 18 + Math.floor(i / 8) * 14, s));
      label(n, n.x, n.y + POD.h / 2 + 124);
    } else {
      const x = n.x - POD.w / 2, y = n.y - POD.h / 2;
      cx.shadowColor = S.theme === 'day' ? 'rgba(48,38,22,0.14)' : 'rgba(0,0,0,0.45)'; cx.shadowBlur = on ? 34 : 22; cx.shadowOffsetY = 8;
      roundRect(x - 8, y - 8, POD.w + 16, POD.h + 70, 20); cx.fillStyle = U.card; cx.fill(); cx.shadowBlur = 0; cx.shadowOffsetY = 0;
      cx.lineWidth = on ? 2 : 1; cx.strokeStyle = on ? U.accent : U.edge; cx.stroke();
      cx.save(); roundRect(x, y, POD.w, POD.h, 14); cx.clip(); cx.drawImage(img, x, y, POD.w, POD.h); cx.restore();
      if (n.gate) { cx.save(); cx.translate(x + POD.w - 30, y + 18); gateBadge({ x: 0, y: 0 }, n.gate, false); cx.restore(); }
      cx.fillStyle = U.ink; cx.font = '450 19px Newsreader, Georgia, serif'; cx.textAlign = 'left'; cx.textBaseline = 'alphabetic'; cx.fillText(n.title, x + 6, y + POD.h + 30);
      cx.fillStyle = U.faint; cx.font = '500 10px "IBM Plex Mono", monospace'; cx.fillText(n.states.map(s => s.toUpperCase()).join(' · '), x + 6, y + POD.h + 48);
      here.forEach((s, i) => dot(x + POD.w - 8 - (i % 9) * 15, y + POD.h + 25 + Math.floor(i / 9) * 14, s));
    }
    // agents at work inside (role-coloured dots wandering the room's floor)
    if (S.style !== 'station' || true) {
      const n2 = here.length ? Math.min(4, 1 + here.length) : 0;
      for (let i = 0; i < n2; i++) {
        const u = (Math.sin(t * 0.6 + i * 2.1 + n.x) + 1) / 2, v = (Math.sin(t * 0.43 + i * 1.3 + n.y) + 1) / 2;
        const ax = S.style === 'station' ? n.x + (u - 0.5) * ORB * 1.1 : n.x + (u - 0.5) * POD.w * 0.7;
        const ay = S.style === 'station' ? n.y + 10 + (v - 0.3) * ORB * 0.6 : n.y + POD.h * 0.12 + v * POD.h * 0.28 + (S.style === 'islands' ? Math.sin(t * 0.8 + n.x * 0.01) * 3 : 0);
        const col = Object.values(ROLE)[(i + n.id.length) % 6];
        cx.beginPath(); cx.arc(ax, ay, 4.5, 0, 6.283); cx.fillStyle = col; cx.shadowColor = col; cx.shadowBlur = S.theme === 'night' ? 10 : 0; cx.fill(); cx.shadowBlur = 0;
      }
    }
    cx.restore();
  }
  function label(n, x, y) {
    cx.textAlign = 'center'; cx.textBaseline = 'alphabetic';
    cx.fillStyle = U.ink; cx.font = '450 20px Newsreader, Georgia, serif'; cx.fillText(n.title, x, y);
    cx.fillStyle = U.faint; cx.font = '500 10px "IBM Plex Mono", monospace'; cx.fillText(n.states.map(s => s.toUpperCase()).join(' · ') + (n.gate ? `  ·  G${n.gate} INSIDE` : ''), x, y + 17);
  }
  function dot(x, y, s) { cx.beginPath(); cx.arc(x, y, 5.5, 0, 6.283); cx.fillStyle = `hsl(${s.hue} 55% ${S.theme === 'day' ? 45 : 62}%)`; cx.fill(); cx.lineWidth = 1.5; cx.strokeStyle = U.card; cx.stroke(); }
  function drawToken(m) {
    const k = curve(m.l), u = m.u, p = qp(k, u);
    const y = S.style === 'islands' ? p.y + Math.sin(u * Math.PI) * 10 - 10 : p.y;
    cx.save();
    cx.beginPath(); cx.arc(p.x, y, 8, 0, 6.283); cx.fillStyle = `hsl(${m.s.hue} 60% ${S.theme === 'day' ? 45 : 64}%)`; cx.shadowColor = cx.fillStyle; cx.shadowBlur = 14; cx.fill(); cx.shadowBlur = 0;
    cx.lineWidth = 2; cx.strokeStyle = U.card; cx.stroke();
    cx.font = '500 12px "Instrument Sans", sans-serif'; cx.textAlign = 'left'; const txt = m.wait > 0 && u >= 0.5 ? `${m.s.title} — waiting for your signature` : m.s.title;
    const tw = cx.measureText(txt).width; roundRect(p.x + 14, y - 11, tw + 14, 22, 11); cx.fillStyle = U.card; cx.fill(); cx.strokeStyle = U.edge; cx.lineWidth = 1; cx.stroke();
    cx.fillStyle = m.wait > 0 && u >= 0.5 ? U.warm : U.ink; cx.textBaseline = 'middle'; cx.fillText(txt, p.x + 21, y + 0.5);
    cx.restore();
  }

  // ── input ─────────────────────────────────────────────────────────────────────────────────────
  const toWorld = (sx, sy) => ({ x: cam.x + (sx - innerWidth / 2) / cam.s, y: cam.y + (sy - midY()) / cam.s });
  const hit = (sx, sy) => { const p = toWorld(sx, sy), d = dims(); return (G.nodes.find(n => S.style === 'station' ? Math.hypot(p.x - n.x, p.y - n.y) < ORB + 10 : Math.abs(p.x - n.x) < d.w / 2 + 8 && p.y > n.y - d.h / 2 - 8 && p.y < n.y + d.h / 2 + 60) || {}).id || null; };
  cv.addEventListener('mousemove', e => { hover = hit(e.clientX, e.clientY); cv.style.cursor = hover ? 'pointer' : 'default'; });
  cv.addEventListener('click', e => { const h = hit(e.clientX, e.clientY); focus = h && h !== focus ? h : null; fit(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') { focus = null; fit(false); } });
  addEventListener('resize', () => fit(false));

  function renderBar() {
    const seg = (id, opts, cur, set) => { const el = document.getElementById(id); el.innerHTML = ''; for (const [v, lab] of opts) { const b = document.createElement('button'); b.textContent = lab; if (v === cur) b.className = 'on'; b.onclick = () => set(v); el.appendChild(b); } };
    seg('styles', Object.entries(STYLES).map(([k, v]) => [k, v[0]]), S.style, v => { S.style = v; focus = null; build(); });
    seg('themes', [['night', 'Night'], ['day', 'Day']], S.theme, v => { S.theme = v; build(); });
    seg('extra', [[false, 'This lab'], [true, '+ 2 rooms of your own']], S.extra, v => { S.extra = v; focus = null; build(); });
    document.getElementById('cap').innerHTML = `<div class="kick">${STYLES[S.style][0]}</div><p>${STYLES[S.style][1]}</p>`;
    const u = new URL(location.href); u.searchParams.set('style', S.style); u.searchParams.set('theme', S.theme); if (S.extra) u.searchParams.set('extra', ''); else u.searchParams.delete('extra'); history.replaceState(null, '', u);

  await build();
  requestAnimationFrame(frame);

})().catch(e => { document.getElementById('busy').textContent = 'Error: ' + e.message; console.error(e); });
