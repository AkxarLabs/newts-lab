<title>The tabletop lab — prototype</title>
<!-- A PROTOTYPE: the lab as an open-plan tabletop in 3D (three.js). Its rooms are the workflow's (workflow/
     stages.yaml) in their own room files (world3d/rooms/*.js), arranged around YOUR desk in the middle; the
     paths between them are the moves a study makes, and the gates stand on the paths they guard. Every newt
     is an agent at the station of the procedure it runs; every card is a study. Nothing here is decoration.
     ?theme=day|night  ?lens=work|cost|waiting|risk  ?extra (two rooms a lab added in Compose)
     All activity is simulated (a fixed seed), so the replay works the same every time. -->

<script type="module">

    wf.stages.splice(wf.stages.findIndex(s => s.id === 'analysis') + 1, 0, { id: 'replication', title: 'Replication', states: ['replicating'], procedures: ['replicate'] });

    wf.rooms.splice(wf.rooms.findIndex(r => r.id === 'lab') + 1, 0, { id: 'data', label: 'Data', title: 'The Data Room', states: ['analysis'] }, { id: 'bench', label: 'Bench', title: 'Replication Bench', states: ['replicating'] });

const WF = workflow();

const specOf = r => scaled(L.rooms[r.id] || plainSpec(r));
const STREET = 3.4, PLAZA = 13, ROOMS = {};

const taken = new Set(['0,0', ...Object.values(PLAN).map(x => x.cell.join(','))]);
const MAINR = WF.rooms.filter(r => (r.states || []).some(s => !SIDE.has(s)));

const XS = [], ZS = [];      // the streets: the column and row edges
{ let x = 0; for (let c = C0; c <= C1; c++) { XS.push(x); x += colW[c]; } XS.push(x); let z = 0; for (let w = R0; w <= R1; w++) { ZS.push(z); z += rowH[w]; } ZS.push(z); }
const ox = XS[-C0] + colW[0] / 2, oz = ZS[-R0] + rowH[0] / 2;      // your desk at the origin
XS.forEach((v, i) => { XS[i] = v - ox; }); ZS.forEach((v, i) => { ZS[i] = v - oz; });
const cx = c => XS[c - C0] + colW[c] / 2, cz = w => ZS[w - R0] + rowH[w] / 2;

/** a room with no file of its own: a floor, low walls, a desk per procedure */
function plainSpec(r) {

  improve: ['experiment-runner'], analyze: ['overseer'], 'review-paper': ['fresh-context-reviewer', 'fresh-context-reviewer'], 'critique-paper': ['fresh-context-reviewer'], propose: ['overseer'], replicate: ['experiment-runner'] };

  'lit-review': ['WebSearch: mixture-of-experts routing collapse', 'Read: papers/shazeer-2017.pdf', 'Write: lit-review.md § novelty'], scope: ['Write: decisions.md — D3 eval set', 'Read: IDEA.md', 'Task: scoping advocate for option B'],
  ideate: ['Write: seeds/cheap-routing.md', 'Task: ideation critic ×2', 'Read: knowledge/ROADMAP.md'], propose: ['Write: proposal.md § budget', 'Read: lit-review.md', 'Bash: guard.py spawn'],
  analyze: ['Bash: uv run scripts/compare.py', 'Write: analysis.md § H1', 'Read: runs/registry.jsonl'], 'write-paper': ['Edit: paper/main.tex § Results', 'Bash: latexmk -pdf', 'Write: claims.yaml'],
  'review-paper': ['Task: fresh-context reviewer ×3', 'Read: paper/main.pdf', 'Write: meta-review.md'], 'make-figures': ['Bash: python figures/plot_loss.py', 'Edit: figures/style.py'],
  improve: ['Edit: src/router.py', 'Bash: uv run scripts/run.py --stage SMOKE'], advance: ['Read: lab/REGISTRY.md', 'Write: triage.md'], finalize: ['Bash: guard.py finalization', 'Write: RECIPE.md'], replicate: ['Bash: git clone --depth 1 …', 'Bash: uv run scripts/run.py --seed 7'] };

const NOW0 = 7 * 3600;

    const role = ROLE[a.role] || ROLE.orchestrator, ss = a.ss;
    const doing = st.ask ? `asking you: “${st.ask.q}”` : st.fail ? 'failed — its run stopped' : st.stall ? 'no progress for 14 minutes' : st.w.moving ? 'walking' : actOf(ss.proc, t + (a.sub ? 60 : 0));
    return `<b>${role[0]}${a.sub ? '' : ''} · ${procTitle(ss.proc)}</b><small>on “${ss.study.title}” — ${doing}</small><small>${Math.round(tokensAt(ss, t) / 1000)}k tokens so far${st.deny ? ' · <span style="color:var(--bad)">blocked by the guard just now</span>' : ''}</small>`;
  }

  if (p.kind === 'room') { const o = ROOMS[p.id], n = actors.filter(a => a.ss && a.ss.room === p.id && where(a.script, t)).length; return `<b>${o.r.title}</b><small>${(o.r.states || []).map(x => LABEL[x]).join(' · ')} — ${n} agent${n === 1 ? '' : 's'} here</small>`; }
  if (p.kind === 'hub') { const n = waitingAt(t).length; return `<b>Your desk</b><small>${n ? n + ' waiting for you' : 'nothing waiting for you'}</small>`; }

}
function waitingAt(t) {

const panel = document.getElementById('panel');
function closePanel() { panel.style.display = 'none'; sel = null; follow = null; }
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, 3200); }
window.__act = m => toast(m);
function openPanel() {
  if (!sel) return; const t = T.t, p = sel; let h = '';
  const X = '<button class="x" onclick="document.getElementById(\'panel\').style.display=\'none\'">✕</button>';

    const a = actors.find(x => x.id === p.id), st = agentState(a, t); if (!st) { closePanel(); return; }
    if (a.kind === 'courier') h = `<div class="kick">Moving a study</div><h2>${a.c.study.title}</h2><p class="lede">${ROOMS[a.c.from].r.title} → ${ROOMS[a.c.to].r.title}</p>${a.c.gate ? `<div class="row"><span>Gate</span><b>${a.c.gate.title}</b></div>` : ''}`;
    else {
      const ss = a.ss, role = ROLE[a.role];
      h = `<div class="kick">${role[0]}${a.sub ? ' · a subagent' : ' · the run’s agent'}</div><h2>${procTitle(ss.proc)}</h2><p class="lede">on ${ss.study.title}</p>
        <div class="row"><span>Started</span><b>${clock(ss.t0)} · ${fmt(ss.t0 - t)}</b></div><div class="row"><span>Tokens so far</span><b>${Math.round(tokensAt(ss, t) / 1000)}k</b></div>
        <div class="row"><span>Status</span><b>${st.ask ? 'waiting for you' : st.fail ? 'failed' : st.stall ? 'stalled' : 'working'}</b></div>
        ${st.ask ? `<p class="lede" style="margin-top:10px">“${st.ask.q}”</p>` : ''}
        <div class="kick" style="margin-top:12px">Recent actions</div><ol>${[0, 1, 2, 3].map(k => `<li>${actOf(ss.proc, t - k * 170)}</li>`).join('')}</ol>
        ${ss.ev.filter(e => e.kind === 'deny' && e.t <= t).map(e => `<div class="row"><span style="color:var(--bad)">Blocked by the guard</span><b>${e.what}</b></div>`).join('')}
        <div class="acts">${st.ask ? '<button class="btn primary" onclick="__answer()">Answer…</button>' : ''}<button class="btn" onclick="__act('Opens the run’s conversation')">Open the conversation</button><button class="btn" onclick="__act('Pins a note it reads at its next checkpoint')">Leave a note</button><button class="btn" onclick="__act('Stops the run (it stays resumable)')">Stop</button></div>`;
      window.__answer = () => { const e = st.ask; e.until = T.t + 30; ss.script = sessionScript(ss); a.script = ss.script; toast('Answered — it walks back to work'); openPanel(); };
    }
  } else if (p.kind === 'study') {
    const s = studies.find(x => x.id === p.id), agents = actors.filter(a => a.ss && a.ss.study === s && where(a.script, t));
    h = `<div class="kick">A study · followed</div><h2>${s.title}</h2><p class="lede">${LABEL[stateAt(s, t)]}</p>
      <div class="kick" style="margin-top:8px">Its path so far</div><ol>${s.timeline.filter(e => e.t <= t).map(e => `<li>${clock(e.t)} · ${LABEL[e.state]}</li>`).join('')}</ol>
      <div class="row"><span>Agents on it now</span><b>${agents.length}</b></div>
      <div class="acts"><button class="btn primary" onclick="__act('Opens the study page')">Open the study</button><button class="btn" onclick="__act('Starts its next step')">Start its next step</button></div>`;
  } else if (p.kind === 'room') {
    const o = ROOMS[p.id];
    h = `<div class="kick">A room</div><h2>${o.r.title}</h2><p class="lede">${(o.r.states || []).map(x => LABEL[x]).join(' · ')}</p>
      <div class="kick" style="margin-top:8px">Its stations</div>${o.procs.map(pr => { const n = actors.filter(a => a.ss && a.ss.room === p.id && a.ss.proc === pr && !a.sub && where(a.script, t)).length; return `<div class="item"><span class="grow">${procTitle(pr)}</span><span class="kick">${n ? n + ' working' : 'free'}</span></div>`; }).join('') || '<div class="item">No procedures — studies rest here.</div>'}
      <div class="row"><span>Studies here</span><b>${studies.filter(s => !carriedAt(s, t) && ROOM_OF[stateAt(s, t)] === p.id).length}</b></div>
      <div class="row"><span>Spent today</span><b>${Math.round(sessions.filter(ss => ss.room === p.id).reduce((a, ss) => a + tokensAt(ss, t), 0) / 1000)}k tokens</b></div>
      <div class="acts"><button class="btn" onclick="__act('Opens this room in Compose: its stations, its states, its look')">Edit in Compose</button></div>`;
  } else if (p.kind === 'hub') {

    h = `<div class="kick">Your desk</div><h2>${w.length ? w.length + ' waiting for you' : 'All clear'}</h2><p class="lede">Questions walk here; gates are signed here.</p>
      ${w.map((x, i) => x.kind === 'ask' ? `<div class="item"><span class="grow"><b>${procTitle(x.ss.proc)}</b> on ${x.ss.study.title}<br><span style="color:var(--soft)">“${x.e.q}”</span></span><button class="btn primary" onclick="__w(${i})">Answer</button></div>`
        : `<div class="item"><span class="grow"><b>${x.c.gate.title.split('—')[0]}</b> — ${x.c.study.title}</span><button class="btn primary" onclick="__w(${i})">Sign</button></div>`).join('')}`;

  }

}

// ── overlays: room labels, what each newt is doing, lens marks ────────────────────────────────────
const labelsEl = document.getElementById('labels');
const tmpV = new THREE.Vector3();
function screen(x, y, z) { tmpV.set(x, y, z).project(camera); return [(tmpV.x + 1) / 2 * innerWidth, (1 - tmpV.y) / 2 * innerHeight, tmpV.z < 1]; }
function overlays(t, live) {
  const out = [], close = cam.r < 34;
  for (const o of Object.values(ROOMS)) {
    const [sx, sy, vis] = screen(o.x, 1.9, o.z - o.ez / 2 - 0.2); if (!vis) continue;
    const n = live.filter(x => x.a.ss && x.a.ss.room === o.r.id).length, asks = live.filter(x => x.a.ss && x.a.ss.room === o.r.id && x.st.ask).length;
    const cost = Math.round(sessions.filter(ss => ss.room === o.r.id).reduce((a, ss) => a + tokensAt(ss, t), 0) / 1000);
    const line = S.lens === 'cost' ? `<span class="hot">${cost}k tokens</span>` : S.lens === 'risk' ? `<span class="${riskOf(o.r.id, t) ? 'hot' : ''}">${riskOf(o.r.id, t)} flagged</span>` : `<span>${n} agent${n === 1 ? '' : 's'}${asks ? ` · <span class="hot">${asks} asking you</span>` : ''}</span>`;
    out.push(`<div class="rl" style="left:${sx}px;top:${sy}px"><b>${o.r.title}</b>${line}</div>`);
  }
  for (const x of live) {
    const head = x.n.group.position, [sx, sy, vis] = screen(head.x, 1.62 * (x.a.role === 'orchestrator' ? 1.35 : 1.1), head.z); if (!vis) continue;
    let cls = '', txt = '';
    if (x.st.ask) { cls = 'ask'; txt = close ? '? ' + x.st.ask.q : '?'; }
    else if (x.st.gate) { cls = 'ask'; txt = close ? `Gate ${x.st.gate.n} — needs your signature` : `G${x.st.gate.n}`; }
    else if (x.st.fail) { cls = 'bad'; txt = close ? 'failed' : '!'; }
    else if (x.st.stall) { cls = 'zzz'; txt = 'zzz'; }
    else if (S.lens === 'risk' && x.st.deny) { cls = 'bad'; txt = close ? 'blocked: ' + x.st.deny.what : '⛨'; }
    else if (S.lens === 'cost' && x.a.ss && !x.a.sub) { cls = 'cost'; txt = Math.round(tokensAt(x.a.ss, t) / 1000) + 'k'; }
    else if (S.lens === 'work' && close && x.a.ss && !x.st.w.moving && (focus ? x.a.ss.room === focus : true)) txt = actOf(x.a.ss.proc, t + (x.a.sub ? 60 : 0));
    if (S.lens === 'waiting' && !(x.st.ask || x.st.gate)) continue;
    if (txt) out.push(`<div class="bub ${cls} ${txt.length < 4 ? 'icon' : ''}" style="left:${sx}px;top:${sy}px">${txt}</div>`);

}
const riskOf = (rid, t) => sessions.filter(ss => ss.room === rid && ss.ev.some(e => (e.kind === 'deny' || e.kind === 'fail') && e.t <= t && e.t > t - 2 * 3600)).length;

// ── the frame ─────────────────────────────────────────────────────────────────────────────────────
let last = performance.now(), panelT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  T.now = Math.min(H, T.now + dt * SPEED);
  if (T.live) T.t = T.now; else if (T.playing) { T.t = Math.min(T.now, T.t + dt * SPEED * 4); if (T.t >= T.now) T.live = true; }

  // actors
  const live = [];
  const seen = new Set();
  for (const a of actors) {
    const st = agentState(a, t); if (!st) continue;
    const n = newtFor(a); seen.add(a.id); n.group.visible = true;
    n.group.position.set(st.w.x, 0.14, st.w.z); n.group.rotation.y = st.w.ry;
    n.update(now / 1000, { pose: st.w.pose, moving: st.w.moving });
    live.push({ a, n, st });
  }
  for (const [id, n] of pool) if (!seen.has(id)) n.group.visible = false;
  // studies: on their room's shelf, or carried

    const c = cards[s.id], k = carriedAt(s, t);
    if (k) { const n = pool.get(k[2].id); if (n && n.group.visible) { c.position.set(n.group.position.x, 1.85 * n.group.scale.y + 0.2, n.group.position.z); c.rotation.y = n.group.rotation.y; c.visible = true; continue; } }
    const rid = ROOM_OF[stateAt(s, t)], o = ROOMS[rid]; if (!o) { c.visible = false; continue; }
    const i = (shelfN[rid] = (shelfN[rid] || 0) + 1) - 1, perRow = Math.max(1, Math.floor(Math.min(3.4, o.spec.size[0] * 0.4) / 0.6));
    const [x, z] = toWorld(o, o.shelfAt[0] + 0.32 + (i % perRow) * 0.6, o.shelfAt[1]);
    c.position.set(x, 0.6 + Math.floor(i / perRow) * 0.09, z); c.rotation.y = o.ry; c.visible = true;
    const dim = follow && follow !== s.id; c.children[0].material.opacity = dim ? 0.3 : 1; c.children[0].material.transparent = !!dim;

  for (const g of Object.values(gateObjs)) { const waiting = w.some(x => x.kind === 'gate' && x.c.gate.n === g.g.n); g.lamp.material.emissiveIntensity = waiting ? 1.6 + Math.sin(now / 160) * 0.6 : 0.15; }
  // lenses: floors tinted by what the lens asks
  for (const o of Object.values(ROOMS)) {
    let tint = null;
    if (S.lens === 'cost') { const c = sessions.filter(ss => ss.room === o.r.id).reduce((a, ss) => a + tokensAt(ss, t), 0), max = 2.5e6; tint = new THREE.Color('#f0b24a').lerp(new THREE.Color('#e0503a'), Math.min(1, c / max)); o.floorMat.color.copy(o.floorBase).lerp(tint, Math.min(0.75, c / max * 0.9 + 0.1)); }
    else if (S.lens === 'risk') o.floorMat.color.copy(o.floorBase).lerp(new THREE.Color('#e0503a'), Math.min(0.6, riskOf(o.r.id, t) * 0.2));
    else if (S.lens === 'waiting') o.floorMat.color.copy(o.floorBase).multiplyScalar(0.55);
    else o.floorMat.color.copy(o.floorBase);
  }

  const k = 1 - Math.pow(0.002, dt);
  for (const key of ['az', 'el', 'r', 'tx', 'tz']) cam[key] += (camT[key] - cam[key]) * k;
  camera.position.set(cam.tx + cam.r * Math.cos(cam.el) * Math.sin(cam.az), cam.r * Math.sin(cam.el), cam.tz + cam.r * Math.cos(cam.el) * Math.cos(cam.az));

    const facing = n[0] * (camera.position.x - wx) + n[1] * (camera.position.z - wz) > 0, target = facing ? 0.14 : 1;
    wl.wall.scale.y += (target - wl.wall.scale.y) * k * 1.5; wl.wall.position.y = 0.14 + 0.75 * wl.wall.scale.y; wl.cap.position.y = 0.14 + 1.5 * wl.wall.scale.y + 0.03;
  }

}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); drawTicks(); if (!focus && !follow) camT.r = fitR(); }
addEventListener('resize', resize); resize(); setInterval(drawTicks, 4000);

// ── the bar and the legend ────────────────────────────────────────────────────────────────────────
const LEGEND = {
  work: ['Work', 'Every newt is an agent at the station of the procedure it runs; small ones are its subagents. Cards are studies, on their room’s shelf or being carried. Zoom in to read what each newt is doing.'],
  cost: ['Cost', 'Floors warm with the tokens spent in each room today; the number over a newt is what its run has used so far.'],
  waiting: ['Waiting', 'Only what is blocked on you: questions at your desk, studies waiting at a gate. Everything else steps back.'],
  risk: ['Risk', 'Agents the guard blocked recently, failed runs, rooms where either happened in the last two hours.'],
};
function seg(id, opts, cur, set) { const el = document.getElementById(id); el.innerHTML = ''; for (const [v, lab] of opts) { const b = document.createElement('button'); b.textContent = lab; if (v === cur) b.className = 'on'; b.onclick = () => set(v); el.appendChild(b); } }
const reloadWith = (k, v) => { const u = new URL(location.href); if (v === false) u.searchParams.delete(k); else u.searchParams.set(k, v === true ? '' : v); location.href = u; };
function renderBar() {
  seg('lens', Object.entries(LEGEND).map(([k, v]) => [k, v[0]]), S.lens, v => { S.lens = v; renderBar(); const u = new URL(location.href); u.searchParams.set('lens', v); history.replaceState(null, '', u); });
  seg('theme', [['day', 'Day'], ['night', 'Night']], S.theme, v => reloadWith('theme', v));
  seg('rooms', [[false, 'This lab'], [true, '+ 2 rooms of your own']], S.extra, v => reloadWith('extra', v));
  document.getElementById('legend').innerHTML = `<div class="kick">${LEGEND[S.lens][0]} lens</div><p>${LEGEND[S.lens][1]}</p>`;
}
renderBar();
if (q.get('focus') && ROOMS[q.get('focus')]) { focusRoom(q.get('focus')); Object.assign(cam, camT); }
window.__LAB = { T, ROOMS, actors, studies, sessions, couriers, cam, camT, overview, focusRoom, waitingAt };
requestAnimationFrame(frame);
</script>
